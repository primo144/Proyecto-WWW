<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vales de Alimentacion | Libros Impresos S.A.</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="container-xl">
      <div class="flex-header-bar">
        <div class="brand-block">
          <span class="brand-badge" aria-hidden="true">LI</span>
          <div>
            <h1 class="brand-title">Libros Impresos S.A.</h1>
            <p class="brand-subtitle">Sistema de Emision y Control de Vales de Alimentacion</p>
          </div>
        </div>

        <nav class="nav-toolbar" aria-label="Navegacion principal" id="main-nav">
          <!-- Botones de navegacion generados dinamicamente segun sesion y rol -->
        </nav>

        <div class="session-summary" id="session-summary">
          <!-- Resumen de usuario autenticado y boton cerrar sesion generado por DOM -->
        </div>
      </div>
    </div>
  </header>

  <main class="app-main container-xl py-4" id="app-root" aria-live="polite">
    <!-- Contenido principal renderizado dinamicamente mediante JavaScript DOM -->
  </main>

  <div id="toast-container" class="toast-stack" aria-live="assertive"></div>

  <footer class="app-footer">
    <div class="container-xl">
      <div class="flex-footer-bar">
        <span>Caso 18 · Operacion 24/7 en Casa Central y Sucursal Norte</span>
        <span id="correlation-status" class="correlation-chip">Listo</span>
      </div>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
